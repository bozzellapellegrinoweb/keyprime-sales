<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#edebe6" />
    <meta name="description" content="KeyPrime Real Estate Sales Management System" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KeyPrime" />
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "071cd2c3-4a3d-4d2f-8deb-fa575aec578d",
        });
      });
    </script>
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <title>KeyPrime - Sales Management</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Palette del portale — tema chiaro, identita' KeyPrime.
      //
      // L'app scrive le classi Tailwind in migliaia di punti: ridefinire qui
      // le scale ricolora tutto in un posto solo, senza riscrivere le classi
      // una per una. Due principi, misurati e non scelti a occhio:
      //
      // 1. Un accento solo. Prima c'erano dieci famiglie di colore in 493
      //    punti; qui ne restano cinque e ognuna vuol dire qualcosa —
      //    l'oro e' il marchio, il navy e' l'inchiostro e l'ordine, verde
      //    rosso e arancio sono stati riservati.
      // 2. Ogni riempimento che porta testo bianco sta sopra 4.5:1. L'unica
      //    eccezione e' l'oro: a 2.29:1 non regge il bianco, quindi i suoi
      //    riempimenti portano il navy (7.47:1).
      //
      // Le scale neutre sono rovesciate di proposito: l'app usa
      // text-zinc-400/500/600 per il testo secondario e bg-zinc-700/800 per
      // le superfici tenui. Su fondo chiaro servono quindi grigi medi in
      // basso e tinte chiarissime in alto — una scala monotona non puo'
      // soddisfare entrambe.
      const NEUTRI = {
        50:  '#141c2b', 100: '#1f2937', 200: '#33404f', 300: '#45525f',
        400: '#566274',  // testo secondario   6.19:1
        500: '#6b7684',  // testo attenuato    4.33:1
        600: '#7d8794',  // etichette          3.64:1
        700: '#e4e0d8',  // bordi e fondi tenui
        800: '#f3f1ec',  // superfici
        900: '#faf9f7',
        950: '#ffffff'
      };
      // Marchio: l'oro riempie, il navy ci scrive sopra.
      const ORO = {
        50: '#fbf8ef', 100: '#f6eed6', 200: '#ecdcac', 300: '#a98a33',
        400: '#836a27',  // testo in oro       5.18:1
        500: '#c9a84c',  // riempimento        (testo navy, 7.47:1)
        600: '#a98a33', 700: '#836a27', 800: '#5c4a1c', 900: '#3a2f12'
      };
      // Inchiostro e ordine: tutto cio' che prima era viola, blu, ciano,
      // indaco o porpora, cioe' decorativo, arriva qui.
      const NAVY = {
        50: '#eef1f6', 100: '#c9d2df', 200: '#9aa8bf', 300: '#6f82a0',
        400: '#4d6383',  // testo              6.13:1
        500: '#2b3f59',  // riempimento        (bianco sopra, 10.73:1)
        600: '#1d2e45', 700: '#15243a', 800: '#0f1c35', 900: '#0a1424'
      };
      const BUONO = {
        50: '#eefaee', 100: '#d2f0d2', 200: '#8ad98a', 300: '#3cb83c',
        400: '#047804',  // testo              5.69:1
        500: '#078507',  // riempimento        (bianco sopra, 4.81:1)
        600: '#066b06', 700: '#045404', 800: '#033d03', 900: '#022902'
      };
      const CRITICO = {
        50: '#fdf1f1', 100: '#f8dcdc', 200: '#eeaaaa', 300: '#e07373',
        400: '#b32d2d',  // testo              6.49:1
        500: '#d03b3b',  // riempimento        (bianco sopra, 4.80:1)
        600: '#b32d2d', 700: '#922424', 800: '#701b1b', 900: '#4e1313'
      };
      const CALDO = {
        50: '#fdf3ee', 100: '#fce7dc', 200: '#f6bfa5', 300: '#ec835a',
        400: '#9c4418',  // testo              6.13:1
        500: '#b04e1f',  // riempimento        (bianco sopra, 5.31:1)
        600: '#9c4418', 700: '#7d3613', 800: '#5e280e', 900: '#3f1b09'
      };

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#141c2b',      // inchiostro primario   17.06:1
              oro: ORO,
              navy: NAVY,
              zinc: NEUTRI, slate: NEUTRI, gray: NEUTRI, neutral: NEUTRI, stone: NEUTRI,
              violet: NAVY, purple: NAVY, indigo: NAVY, blue: NAVY, cyan: NAVY, sky: NAVY,
              amber: ORO, yellow: ORO,
              emerald: BUONO, green: BUONO, teal: BUONO, lime: BUONO,
              red: CRITICO, rose: CRITICO,
              orange: CALDO, pink: CALDO, fuchsia: CALDO
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif']
            }
          }
        }
      };
    </script>

    <style>
      /* Il menu a tendina di un <select> non lo disegna la pagina: lo disegna
         il sistema operativo. Con il tema chiaro va dichiarato chiaro, o il
         sistema lo costruisce scuro su un'interfaccia chiara. */
      :root { color-scheme: light; }

      select option { background-color: #ffffff; color: #141c2b; }

      /* Safe area for iOS notch */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      @media all and (display-mode: standalone) {
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }

      /* Capacitor native app styles */
      .capacitor-ios body { padding-top: env(safe-area-inset-top); }
      .capacitor-android body { padding-top: 0; }

      /* Keyboard open state */
      body.keyboard-open { height: auto !important; }
      body.keyboard-open .fixed.bottom-0 { position: absolute; }

      /* Prevent overscroll bounce */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      html { scroll-behavior: smooth; }
      body { background: #edebe6; color: #141c2b; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Touch feedback */
      .active\:scale-95:active { transform: scale(0.95); }

      /* Disable text selection on buttons */
      button, a { -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body class="bg-[#edebe6]">
    <noscript>Devi abilitare JavaScript per usare questa app.</noscript>
    <div id="root"></div>
  </body>
</html>
