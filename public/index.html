<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#edebe6" />
    <meta name="description" content="KeyPrime Real Estate Sales Management System" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KeyPrime" />
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "071cd2c3-4a3d-4d2f-8deb-fa575aec578d",
        });
      });
    </script>
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <title>KeyPrime - Sales Management</title>
    
    <!-- Tailwind non arriva piu' da CDN: il CSS si compila al build
         (tailwind.config.js + src/index.css). Il compilatore nel browser
         ricompilava il foglio a ogni cambio di classe, ed era meta' del
         costo di ogni interazione. -->
  </head>
  <body class="bg-[#edebe6]">
    <noscript>Devi abilitare JavaScript per usare questa app.</noscript>
    <div id="root"></div>
  </body>
</html>
