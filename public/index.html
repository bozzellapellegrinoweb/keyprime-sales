<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0d1116" />
    <meta name="description" content="KeyPrime Real Estate Sales Management System" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KeyPrime" />
    
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "071cd2c3-4a3d-4d2f-8deb-fa575aec578d",
        });
      });
    </script>
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <title>KeyPrime - Sales Management</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // La scala "zinc" e "slate" di Tailwind viene ridefinita sulle tonalita'
      // navy del marchio KeyPrime. L'app usa quelle classi in centinaia di
      // punti: ridefinirle qui ricolora tutto in modo coerente, senza
      // riscrivere le classi una per una.
      // Palette dell'interfaccia.
      //
      // Il fondo e' un grigio scuro quasi neutro, con una punta appena fredda.
      // Un blu saturo a tutto schermo affatica la vista, e spegne l'oro del
      // marchio invece di farlo risaltare: l'accento vive meglio su una tela
      // neutra. Le classi zinc-* e slate-* usate in tutta l'app leggono da qui.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              oro: {
                50:  '#fbf8ef', 100: '#f6eed6', 200: '#ecdcac',
                300: '#dfc579', 400: '#d3b257', 500: '#c9a84c',
                600: '#a98a33', 700: '#836a27', 800: '#5c4a1c', 900: '#3a2f12'
              },
              navy: {
                50:  '#f5f7fa', 100: '#e9edf3', 200: '#cfd6e0',
                300: '#a7b2c2', 400: '#78859a', 500: '#56637a',
                600: '#3d4858', 700: '#2b3340', 800: '#1b212b', 900: '#141920',
                950: '#0d1116'
              },
              zinc: {
                50:  '#f7f9fb', 100: '#eef1f5', 200: '#dde2e9',
                300: '#c2c9d4', 400: '#9aa3b2', 500: '#6f7889',
                600: '#4c5464', 700: '#2b323d', 800: '#1b212b',
                900: '#141920', 950: '#0d1116'
              },
              slate: {
                50:  '#f7f9fb', 100: '#eef1f5', 200: '#dde2e9',
                300: '#c2c9d4', 400: '#9aa3b2', 500: '#6f7889',
                600: '#4c5464', 700: '#2b323d', 800: '#1b212b',
                900: '#141920', 950: '#0d1116'
              }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif']
            }
          }
        }
      };
    </script>
    
    <style>
      /* Il menu a tendina di un <select> non lo disegna la pagina: lo disegna
         il sistema operativo. Senza color-scheme lo costruisce in chiaro, e le
         voci risultano illeggibili su un'interfaccia scura. Questa riga e'
         quella che le rende leggibili, non le classi sul <select>. */
      :root { color-scheme: dark; }

      /* Ripiego per i browser che impaginano le opzioni da se'. */
      select option {
        background-color: #1b212b;
        color: #f2f5f8;
      }

      /* La freccia nativa la disegna gia' il browser in versione scura grazie
         a color-scheme: sostituirla con una immagine di sfondo obbligava ad
         aggiungere spazio a destra, e nelle barre di filtro strette questo
         troncava le etichette ("Tutte le zo…"). Si lascia quella nativa. */

      /* Safe area for iOS notch */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
      
      @media all and (display-mode: standalone) {
        body { 
          padding-top: env(safe-area-inset-top); 
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      
      /* Capacitor native app styles */
      .capacitor-ios body {
        padding-top: env(safe-area-inset-top);
      }
      
      .capacitor-android body {
        padding-top: 0;
      }
      
      /* Keyboard open state */
      body.keyboard-open {
        height: auto !important;
      }
      
      body.keyboard-open .fixed.bottom-0 {
        position: absolute;
      }
      
      /* Prevent overscroll bounce */
      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      html { scroll-behavior: smooth; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Scrollbar hide for horizontal carousels */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Touch feedback */
      .active\:scale-95:active { transform: scale(0.95); }
      
      /* Disable text selection on buttons */
      button, a { -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body class="bg-[#0d1116]">
    <noscript>Devi abilitare JavaScript per usare questa app.</noscript>
    <div id="root"></div>
  </body>
</html>
